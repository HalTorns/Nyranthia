name: JDR - Tests et Docker

on:
  push:
    paths: ['JDR/**', '.github/workflows/jdr.yml']
  pull_request:
    paths: ['JDR/**', '.github/workflows/jdr.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: JDR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: JDR/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Préparer une configuration de test isolée
        run: |
          echo "NYRANTHIA_AUTH_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "NYRANTHIA_AUTH_USER=auteur" >> "$GITHUB_ENV"
          echo "NYRANTHIA_PUBLIC_URL=http://127.0.0.1:4319" >> "$GITHUB_ENV"
          echo "COMPOSE_PROJECT_NAME=nyranthia-test-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "NYRANTHIA_DOCKER_TEST=1" >> "$GITHUB_ENV"
      - name: Construire et démarrer le conteneur
        run: docker compose -f docker-compose.yaml -f compose.local.yaml up --build --wait --wait-timeout 120
      - name: Vérifier authentification, écriture et persistance après recréation
        run: npm run test:docker
      - name: Journaux Docker en cas d’échec
        if: failure()
        run: docker compose -f docker-compose.yaml -f compose.local.yaml logs --tail 100
      - name: Arrêter le conteneur de test
        if: always()
        run: docker compose -f docker-compose.yaml -f compose.local.yaml down
